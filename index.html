<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Practice quiz and progress tracker for the ServiceNow CIS - Data Foundations (CMDB & CSDM) exam." />
    <title>CIS-DF Trainer</title>
    <meta name="theme-color" content="#0a0d12" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply a saved light/dark choice before first paint to avoid a theme flash.
      try {
        var t = localStorage.getItem('examquiz_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
