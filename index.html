<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Practice quiz and progress tracker for the ServiceNow CIS - Data Foundations (CMDB & CSDM) exam." />
    <title>CIS-DF Trainer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='11' fill='%2310151d'/%3E%3Cpath d='M12 27 L20 13 L28 27 Z' fill='none' stroke='%23323c4d' stroke-width='1.5'/%3E%3Ccircle cx='20' cy='13' r='4' fill='%2345d9a8'/%3E%3Ccircle cx='12' cy='27' r='4' fill='%2379a6ff'/%3E%3Ccircle cx='28' cy='27' r='4' fill='%23ffc463'/%3E%3C/svg%3E"
    />
    <script>
      // Apply a saved light/dark choice before first paint to avoid a theme flash.
      try {
        var t = localStorage.getItem('examquiz_theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
